{% extends "frappe/templates/base.html" %}

{% set design_system_asset_version = "20260422-theme-toggle-1" %}

{% block head %}
{{ super() }}

<script>
	(function () {
		const storageKey = "gris-theme";
		const root = document.documentElement;
		let theme = "light";

		try {
			const storedTheme = window.localStorage.getItem(storageKey);
			if (storedTheme === "dark") {
				theme = "dark";
			}
		} catch (error) {
			// Ignore storage access issues and keep the default theme.
		}

		// Apply the saved theme before styles paint to avoid a light/dark flash.
		root.classList.toggle("dark", theme === "dark");
		root.dataset.theme = theme;
	})();
</script>
