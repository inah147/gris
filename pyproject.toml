[project]
name = "gris"
authors = [
    { name = "Grupo Escoteiro Professora Inah de Mello - 47/SP", email = "tecnologia@gepim.com.br"}
]
description = "App base para gestão complementar de Grupos Escoteiros"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # Espelha o pin do Frappe v15. cryptography entra como dependência transitiva de
    # pdfplumber (via pdfminer.six), que não declara limite superior: sem este pin,
    # `bench get-app` — que roda `pip install -U` — sobe o cryptography acima da faixa
    # suportada e o pyOpenSSL do Frappe quebra com
    # "module 'lib' has no attribute 'GEN_EMAIL'", derrubando o bench inteiro.
    # Ao atualizar, conferir a faixa em apps/frappe/pyproject.toml do bench.
    "cryptography~=50.0.0",
    # Sobrepõe o pin do Frappe v15 (Pillow~=12.3.0): o 12.3.0 tem dezenas de CVEs
    # (estouro de buffer nos decoders de JPEG/TIFF, bombas de descompressão etc.)
    # corrigidas só no 13.0.0, e o Frappe abre com o Pillow toda imagem enviada.
    # Nenhuma das quebras do 13.0 atinge o que o Frappe ou este app usam. Como o
    # gris é instalado depois do Frappe, este pin é o que vale no bench; o pip só
    # avisa do conflito. O 13 exige Python >= 3.11 — daí o requires-python acima.
    # Quando o Frappe subir o próprio pin, este pode sair.
    "Pillow~=13.0",
    "pandas",
    "dateparser",
    "ofxparse",
    "openpyxl",
    "numpy",
    "pdfplumber",
    "Faker>=24.0.0",
    "PyYAML>=6.0",
    "qrcode[pil]>=7.4",
    "PyMuPDF>=1.23",  # rodapé (degradê + nº de página) do relatório em PDF
    # Integrações com Google Drive e Google Docs. Já vinham do ambiente do bench, mas
    # agora são usadas em caminho de request do portal (envio de documentos da recepção),
    # não só em job de backup: declarar evita um ambiente sem elas quebrar a tela.
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
